name: Changelog Pflicht

# Runs on EVERY pull request AND on every push to main, deliberately.
#
# The pull-request half: this job is a required check on main, and a required
# check that is filtered out by path never reports at all — it sits as
# "expected" forever and the pull request can only be merged by an
# administrator overriding the protection. That is what happened to every
# docs-only and CI-only pull request in this repo. The rule itself has not
# changed: the job decides for itself whether the rule applies, and says so,
# instead of the trigger deciding whether anyone hears from it.
#
# The push half closes the same hole on the other side. Until 29.10.2026 the
# trigger was `pull_request` only, measured: 30 of the last 30 runs of this
# workflow were pull-request events, and no push to main had ever produced a
# changelog verdict. A direct push could therefore drop an entry and nothing
# would say so — the one thing this workflow exists to prevent. What the push
# trigger does NOT do is remove the "Bypassed rule violations" notice on a
# direct push: a brand-new commit cannot carry check results that only exist
# once it has landed, so under required status checks EVERY direct push to
# main reports all five contexts as "expected" and needs the bypass. That is
# a property of pushing straight to a protected branch, not of this file.
on:
  pull_request:
    branches: [main, releases]
  push:
    branches: [main]

jobs:
  check:
    name: CHANGELOG.md aktualisiert?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full history for the diff ranges below

      - name: Prüfen ob CHANGELOG.md geändert wurde
        id: scope
        env:
          # Passed through the environment rather than interpolated into the
          # script body: a ref name is attacker-controlled on a fork and
          # ${{ }} would splice it straight into the shell.
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A pull request is judged against its merge base; a push is judged
          # against the commit the branch pointed at BEFORE the push, so a
          # three-commit push is read as one change set instead of only its
          # tip. Force pushes are disabled on main, so PUSH_BEFORE stays
          # reachable — the guard below is for a branch creation, where it is
          # the all-zero SHA.
          if [ "$EVENT_NAME" = "push" ]; then
            if [ -n "$PUSH_BEFORE" ] \
               && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              FILES=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER")
            elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
              echo "Vorgänger-SHA des Push nicht nutzbar — vergleiche HEAD~1..HEAD."
              FILES=$(git diff --name-only HEAD~1 HEAD)
            else
              echo "Kein Vorgänger-Commit — betrachte alle Dateien des Commits."
              FILES=$(git show --name-only --format= HEAD)
            fi
          else
            FILES=$(git diff --name-only "origin/${BASE_REF:-main}...HEAD")
          fi
          # Published so the structure step can skip a change set that does
          # not touch this file at all; without it that step would judge
          # main's existing state and refuse work that cannot fix it.
          {
            echo "files<<__EOF__"
            echo "$FILES"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          if ! echo "$FILES" | grep -qE '^(custom_components/|CHANGELOG\.md$)'; then
            echo "Kein Integrations-Code geändert (nur Doku/CI/Tests) — CHANGELOG-Pflicht gilt hier nicht."
            exit 0
          fi
          if ! echo "$FILES" | grep -q "CHANGELOG.md"; then
            echo ""
            echo "══════════════════════════════════════════"
            echo "  CHANGELOG.md wurde nicht aktualisiert!"
            echo "══════════════════════════════════════════"
            echo ""
            echo "Bitte trage deine Änderungen im Unreleased-Block ein:"
            echo ""
            echo "  ## [Unreleased]"
            echo "  ### Hinzugefügt / Geändert / Behoben"
            echo "  - Beschreibung der Änderung"
            echo "    Autor: @dein-name"
            echo ""
            exit 1
          fi
          echo "CHANGELOG.md wurde aktualisiert — OK"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # The step above asks whether CHANGELOG.md was *touched*. That is a
      # different question from whether the result is intact, and twice in one
      # day the difference cost an entry: a merge left the Unreleased block with
      # two "### Behoben / Fixed" headings, and a conflict resolution dropped
      # main's whole "### Hinzugefuegt / Added" section. Both times the file WAS
      # modified, so the step above passed it.
      #
      # What runs here is the conflict-marker check and the duplicate-heading
      # check, and nothing else. In particular NOT --base: the lost-entry
      # comparison was measured against this file's own history and would have
      # refused 18 of the last 79 commits to it, 14 of them purely because a
      # bold title had been copy-edited. A required check that refuses close to
      # one pull request in five gets a --skip added to it and then protects
      # nothing, so it stays a local diagnostic (see the script's docstring).
      # Dropping it also removes two separate ways --base turns an innocent pull
      # request red: comparing against main's tip rather than the merge base,
      # and racing a main that advances between the event and a re-run.
      #
      # The `if` guard matters for the same reason. A step with no guard runs
      # after the docs-only `exit 0` above, which ends that STEP and not the
      # job — so a pull request changing one documentation file would be
      # refused for damage already sitting on main. That is not hypothetical:
      # three of the last 80 revisions of CHANGELOG.md on main carried a
      # duplicated heading in the Unreleased block.
      - name: CHANGELOG-Struktur pruefen (Konfliktmarker, Dubletten-Heading)
        if: contains(steps.scope.outputs.files, 'CHANGELOG.md')
        run: python scripts/check_changelog_structure.py
