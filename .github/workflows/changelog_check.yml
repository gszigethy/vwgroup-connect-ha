name: Changelog Required

# Runs on EVERY pull request, deliberately. This job is a required check on
# main, and a required check that is filtered out by path never reports at
# all — it sits as "expected" forever and the pull request can only be merged
# by an administrator overriding the protection. That is what happened to
# every docs-only and CI-only pull request in this repo. The rule itself has
# not changed: the job decides for itself whether the rule applies, and says
# so, instead of the trigger deciding whether anyone hears from it.
on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: CHANGELOG.md updated?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full history for git diff origin/main...HEAD

      - name: Check whether CHANGELOG.md was updated
        run: |
          FILES=$(git diff --name-only origin/main...HEAD)
          if ! echo "$FILES" | grep -qE '^(custom_components/|CHANGELOG\.md$|docs/CHANGELOG_TECHNICAL\.md$)'; then
            echo "No integration code changed (docs/CI/tests only) — CHANGELOG update is not required."
            exit 0
          fi
          if ! echo "$FILES" | grep -q "CHANGELOG.md"; then
            echo ""
            echo "══════════════════════════════════════════"
            echo "  CHANGELOG.md was not updated!"
            echo "══════════════════════════════════════════"
            echo ""
            echo "Please add your changes to the Unreleased section:"
            echo ""
            echo "  ## [Unreleased]"
            echo "  ### Added / Changed / Fixed"
            echo "  - Description of the change"
            echo "    Author: @your-name"
            echo ""
            exit 1
          fi
          echo "CHANGELOG.md was updated — OK"
