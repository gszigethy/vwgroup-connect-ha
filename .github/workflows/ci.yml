name: CI

on:
  push:
    branches: [main, releases]
  pull_request:
    branches: [main, releases]

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install \
            ruff==0.15.12 \
            mypy \
            homeassistant

      - name: Ruff Lint
        run: ruff check custom_components/

      - name: mypy strict
        run: |
          mypy custom_components/vag_connect/ \
            --ignore-missing-imports \
            --disallow-untyped-defs \
            --disallow-incomplete-defs \
            --warn-return-any \
            --no-error-summary

      - name: Validate manifest.json
        run: |
          python3 -c "
          import json, sys
          m = json.load(open('custom_components/vag_connect/manifest.json'))
          required = ['domain', 'name', 'version', 'requirements', 'iot_class', 'config_flow']
          missing = [k for k in required if k not in m]
          if missing:
              print('ERROR: Missing fields:', missing); sys.exit(1)
          # requirements can be empty (we bundle our own client) or contain pypi packages
          print('requirements:', m.get('requirements', []))
          valid_iot = ('cloud_push', 'cloud_polling', 'local_push', 'local_polling')
          if m.get('iot_class') not in valid_iot:
              print('ERROR: Invalid iot_class:', m.get('iot_class')); sys.exit(1)
          print('iot_class:', m['iot_class'])
          print('manifest.json OK — Version:', m['version'])
          "

      - name: Validate all JSON files
        run: |
          python3 -c "
          import json, os, sys
          errors = []
          for root, _, files in os.walk('custom_components'):
              for f in files:
                  if f.endswith('.json'):
                      p = os.path.join(root, f)
                      try:
                          json.load(open(p))
                          print(f'OK: {p}')
                      except Exception as e:
                          errors.append(f'ERROR {p}: {e}')
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          "

      - name: CHANGELOG.md contains current version
        run: |
          python3 -c "
          import json, sys
          version = json.load(open('custom_components/vag_connect/manifest.json'))['version']
          changelog = open('CHANGELOG.md').read()
          if f'[{version}]' not in changelog:
              print(f'ERROR: Version {version} not found in CHANGELOG.md!')
              sys.exit(1)
          print(f'CHANGELOG.md contains version {version} — OK')
          "

  tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Test-Install dependencies
        run: |
          pip install \
            pytest \
            pytest-cov \
            pytest-asyncio \
            hypothesis \
            voluptuous \
            homeassistant

      - name: Run tests with coverage
        id: pytest
        run: |
          set -o pipefail
          # Threshold lowered from 70 → 65 because image.py + select.py
          # are untested (will land in Sessions 2–4). See #62.
          python3 -m pytest tests/ -v --tb=long \
            --cov=custom_components/vag_connect \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=75 2>&1 | tee pytest_output.log

      - name: SonarQube Cloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Show pytest output in step summary on failure
        if: failure()
        run: |
          {
            echo "## Pytest failure summary"
            echo ""
            echo '```'
            # Show only the FAILED lines + tracebacks (last ~200 lines usually)
            grep -E "^(FAILED|ERROR|E   |_____|=====|tests/.*::)" pytest_output.log | head -200 || true
            echo '```'
            echo ""
            echo "## Last 100 lines of pytest output"
            echo '```'
            tail -100 pytest_output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest log as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-output
          path: pytest_output.log
          retention-days: 7
          if-no-files-found: ignore

  hassfest:
    name: HA Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # SHA-pinned per supply-chain-hardening (v1.24.1, 2026-05-08).
      # home-assistant/actions has no semver tags — pin to commit SHA.
      # Bump manually when upstream announces breaking changes.
      - uses: "home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3"
