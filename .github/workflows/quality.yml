# Fork-only (gszigethy/vwgroup-connect-ha). Upstream's ci.yml stays the test,
# strict-mypy, hassfest and HACS gate; this adds the defect baseline used in
# the owner's other repositories. See .github/QUALITY.md.
name: Quality baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Normalize comparison base
        run: |
          if [ -z "$QUALITY_BASE" ] || ! git cat-file -e "$QUALITY_BASE^{commit}" 2>/dev/null; then
            echo "QUALITY_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install analysis tools
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/ci/requirements.txt
      - name: Python syntax
        run: python -m compileall -q custom_components tests
      - name: Block new Python defects
        run: python .github/ci/lint_baseline.py ruff ruff check --isolated --no-respect-gitignore --select E9,F63,F7,F82 --output-format json custom_components tests
      - name: Python type diagnostics (baseline report)
        continue-on-error: true
        run: mypy --ignore-missing-imports --follow-imports skip custom_components

  tests:
    # Upstream's ci.yml runs the suite on main and on pull requests to main;
    # this covers every other branch pushed to the fork.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install test dependencies (same set as upstream ci.yml)
        run: pip install pytest pytest-cov pytest-asyncio hypothesis aiohttp voluptuous homeassistant
      - name: Pytest
        run: python -m pytest tests/ -q --cov=custom_components/vag_connect --cov-report=term --cov-report=xml --cov-fail-under=75
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: coverage.xml
